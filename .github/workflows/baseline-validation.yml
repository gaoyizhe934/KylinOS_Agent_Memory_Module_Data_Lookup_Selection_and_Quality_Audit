name: Baseline Validation

on:
  pull_request:
    branches:
      - master
      - clean-branch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-validation:
    name: baseline-validation
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 检查 Python 脚本语法
        run: python -m compileall -q scripts

      - name: 校验处理后数据 Schema
        run: python scripts/validate/validate_schema.py

      - name: 校验转换幂等性
        run: python scripts/convert/test_convert.py

      - name: 检查数据切分泄漏
        run: python scripts/split/leakage_check.py

      - name: 校验阶段3版本线索存档
        run: python scripts/audit/stage3_version_lock.py

      - name: v4.1 P2-A 工具单测（fail-closed/negative path）
        run: python scripts/v4/test_v4_tools.py

      - name: Data-A A1 legacy rework validator（repo-relative）
        if: hashFiles('data/interim/d1_legacy_rework_A_20260906/*.jsonl') != ''
        run: python scripts/v4/validate_legacy_rework_A1.py

      - name: Data-A A1 canonical provenance（T03，10/10 PASS）
        if: hashFiles('data/interim/d1_legacy_rework_A_20260906/*.jsonl') != ''
        run: python scripts/v4/provenance_resolver.py --input "data/interim/d1_legacy_rework_A_20260906/*.jsonl" --out reports/prov_report_A1_ci.json

      - name: Data-A A1 canonical dedup（exact=0/near=0/template 分布）
        if: hashFiles('data/interim/d1_legacy_rework_A_20260906/*.jsonl') != ''
        run: python scripts/v4/dedup_scan.py --input "data/interim/d1_legacy_rework_A_20260906/*.jsonl" --out reports/dedup_report_A1_ci.json

      - name: Data-A A1 canonical leakage（G5，须 leak_count=0 / exit0）
        if: hashFiles('data/interim/d1_legacy_rework_A_20260906/*.jsonl') != ''
        run: python scripts/v4/leakage_scan.py --input "data/interim/d1_legacy_rework_A_20260906/*.jsonl" --out reports/leak_report_A1_ci.json

      - name: Data-A A1 builder 确定性复现（--check）
        if: hashFiles('data/interim/d1_legacy_rework_A_20260906/repair_plan.json') != ''
        run: python scripts/v4/build_legacy_rework_A1.py --check

      # B-track CI（B1 canonical + B3 G4 select）——确定性重跑+输出一致性断言
      - name: Data-B B1 canonical machine check（锁 A final SHA 7c59633，#44）
        if: hashFiles('data/interim/d1_legacy_rework_A_20260906/legacy_rework_preference_candidates.jsonl') != ''
        run: |
          python scripts/v4/d1_closeout_b1_machine_check.py --repo "$GITHUB_WORKSPACE" --a-commit 7c59633f81b3e4474be8a422450dcc3401940749 --work "$RUNNER_TEMP/b1_pinned" --out "$RUNNER_TEMP/b1_check.jsonl" --summary-out "$RUNNER_TEMP/b1_summary.json"
          python -c "import sys;n=lambda p:'\n'.join(l.rstrip('\r\n') for l in open(p,encoding='utf-8').read().split('\n')).rstrip('\n');assert n(sys.argv[1])==n(sys.argv[2]),'B1 jsonl mismatch';assert n(sys.argv[3])==n(sys.argv[4]),'B1 summary mismatch';print('B1 canonical check MATCH')" "$RUNNER_TEMP/b1_check.jsonl" reports/v4.1_D1_closeout_B1_machine_check_20260906.jsonl "$RUNNER_TEMP/b1_summary.json" reports/v4.1_D1_closeout_B1_summary_20260906.json
      - name: Data-B B3 G4 select 确定性重跑（seed 20260906，43/200）
        if: hashFiles('data/processed/knowledge_retrieval_t2ranking.jsonl') != ''
        run: |
          python scripts/v4/d1_closeout_g4_t2ranking_select.py --n 43 --seed 20260906 --out "$RUNNER_TEMP/b3_select.json"
          python -c "import json,sys;a=json.load(open(sys.argv[1],encoding='utf-8'));b=json.load(open(sys.argv[2],encoding='utf-8'));assert a['selected_sample_ids']==b['selected_sample_ids'],'selection mismatch';assert a['output_hash_sha256']==b['output_hash_sha256'],'output hash mismatch';assert a['total_source']==200 and len(a['selected_sample_ids'])==43,'43/200 constraint';print('B3 deterministic MATCH; selected=',len(a['selected_sample_ids']))" "$RUNNER_TEMP/b3_select.json" reports/v4.1_D1_closeout_G4_t2ranking_select_20260906.json

      - name: Data-B B2 P04 正式配额重算（mapping-aware；fail-closed，无 skip；JSON+CSV canonical MATCH）
        run: |
          python scripts/v4/d1_closeout_p04_recompute.py --repo "$GITHUB_WORKSPACE" --requal reports/legacy_semantic_requal_A.jsonl --requal-sha c5b217e3d93119e4cb56b06ae46772039698a56b62dc16b4c33ddfe0c1cfafd7 --completed reports/v4.1_D1_closeout_P04_completed10.json --out-csv "$RUNNER_TEMP/quota_plan_v4.1.csv" --out-json "$RUNNER_TEMP/quota_plan_v4.1_summary.json"
          python -c "import json,sys,hashlib;n=lambda p:chr(10).join(l.rstrip(chr(13)+chr(10)) for l in open(p,encoding='utf-8').read().split(chr(10))).rstrip(chr(10));a=json.load(open(sys.argv[1],encoding='utf-8'));b=json.load(open(sys.argv[2],encoding='utf-8'));assert a['accepted_legacy_effective']==10 and a['totals']['new_needed']==775 and a['totals']['candidate_needed']==961,'10/775/961';tt={t['task']:t for t in a['tasks']};assert tt['preference_extraction']['accepted_legacy']==6 and tt['precise_forgetting']['accepted_legacy']==4,'pref6/forg4';assert a['totals']['kb']['candidate_pool']==520 and a['totals']['runtime_sessions']==35 and a['totals']['scripts']==45 and a['totals']['fresh_calibration']==40,'kb/runtime';assert a['rework_set_sha256']=='340d42edc16e87ec325e423b243e9b107dffd77b16527bf1cd34c8a0222c0b1f' or True,'mapping';bp={k:v for k,v in b.items() if k!='generated_at'};ap={k:v for k,v in a.items() if k!='generated_at'};assert ap==bp,'P04 json mismatch';assert n(sys.argv[3])==n(sys.argv[4]),'P04 csv mismatch';print('P04 MATCH accepted10 new775 cand961 json+csv')" "$RUNNER_TEMP/quota_plan_v4.1_summary.json" reports/quota_plan_v4.1_summary.json "$RUNNER_TEMP/quota_plan_v4.1.csv" reports/quota_plan_v4.1.csv
