name: Baseline Validation

on:
  pull_request:
    branches:
      - master
      - clean-branch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-validation:
    name: baseline-validation
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 检查 Python 脚本语法
        run: python -m compileall -q scripts

      - name: 校验处理后数据 Schema
        run: python scripts/validate/validate_schema.py

      - name: 校验转换幂等性
        run: python scripts/convert/test_convert.py

      - name: 检查数据切分泄漏
        run: python scripts/split/leakage_check.py

      - name: 校验阶段3版本线索存档
        run: python scripts/audit/stage3_version_lock.py

      - name: v4.1 P2-A 工具单测（fail-closed/negative path）
        run: python scripts/v4/test_v4_tools.py

      - name: Data-A A1 legacy rework validator（repo-relative）
        if: hashFiles('data/interim/d1_legacy_rework_A_20260906/*.jsonl') != ''
        run: python scripts/v4/validate_legacy_rework_A1.py

      - name: Data-A A1 canonical provenance（T03，10/10 PASS）
        if: hashFiles('data/interim/d1_legacy_rework_A_20260906/*.jsonl') != ''
        run: python scripts/v4/provenance_resolver.py --input "data/interim/d1_legacy_rework_A_20260906/*.jsonl" --out reports/prov_report_A1_ci.json

      - name: Data-A A1 builder 确定性复现（--check）
        if: hashFiles('data/interim/d1_legacy_rework_A_20260906/repair_plan.json') != ''
        run: python scripts/v4/build_legacy_rework_A1.py --check
